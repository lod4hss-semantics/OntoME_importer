[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontome-importer"
version = "0.1.0"
description = "Generic RDF/OWL to OntoME import tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "LOD4HSS Semantics"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "jsonschema[format-nongpl]>=4.18",
  "lxml>=5.0",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0",
  "rdflib>=7.0",
]

[project.urls]
Repository = "https://github.com/lod4hss-semantics/OntoME_importer"
Issues = "https://github.com/lod4hss-semantics/OntoME_importer/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ontome-importer = "ontome_importer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontome_importer"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ontome_importer/schemas"
"resources" = "ontome_importer/resources"

[tool.hatch.build.targets.sdist]
include = ["src/ontome_importer", "schemas", "resources", "profiles", "README.md", "LICENSE"]
