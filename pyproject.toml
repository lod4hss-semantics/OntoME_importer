[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontome-importer"
version = "0.1.0"
description = "Generic RDF/OWL to OntoME import tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "jsonschema[format-nongpl]>=4.18",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "rdflib>=7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ontome-importer = "ontome_importer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontome_importer"]
